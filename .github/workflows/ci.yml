name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every target platform
        run: make release-snapshot

      - uses: actions/upload-artifact@v7
        with:
          name: geocheck-snapshot
          path: dist/
          retention-days: 7

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Flags and help work
        run: |
          ./geocheck --version
          ./geocheck --help 2>&1 | grep -q 'Usage:'
          if ./geocheck --definitely-not-a-flag 2>/dev/null; then
            echo "unknown flag was accepted"; exit 1
          fi
          if ./geocheck -4 -6 2>/dev/null; then
            echo "-4 -6 was accepted"; exit 1
          fi

      - name: JSON output is well formed
        run: |
          ./geocheck -4 --json --no-mtr -g cdn --timeout 20 > out.json || true
          python3 -c "import json,sys; d=json.load(open('out.json')); print('schema', d['schema'])"

  launcher:
    name: geocheck.ing launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck the launcher
        run: shellcheck scripts/geocheck.sh scripts/build-worker.sh

      - name: It must parse under a strict POSIX shell, not just bash
        run: |
          sh -n scripts/geocheck.sh
          dash -n scripts/geocheck.sh

      - name: Build the Worker and verify it serves the script unchanged
        run: |
          set -euo pipefail
          ./scripts/build-worker.sh
          node --check web/dist/worker.js

          cat > /tmp/roundtrip.mjs <<'EOF'
          const mod = await import(process.env.WORKER);
          const r = await mod.default.fetch(new Request("https://geocheck.ing/geocheck.sh"));
          process.stdout.write(await r.text());
          EOF
          WORKER="$PWD/web/dist/worker.js" node /tmp/roundtrip.mjs > /tmp/served.sh
          diff scripts/geocheck.sh /tmp/served.sh

      - name: The launcher must resolve platform assets correctly
        run: |
          set -euo pipefail

          fn=$(sed -n '/^platform_asset()/,/^}/p' scripts/geocheck.sh)
          tmp=$(mktemp -d); mkdir -p "$tmp/bin"

          expect() {
            # shellcheck disable=SC2016
            printf '#!/bin/sh\ncase "$1" in\n  -s) echo %s ;;\n  -m) echo %s ;;\nesac\n' \
              "$1" "$2" > "$tmp/bin/uname"
            chmod +x "$tmp/bin/uname"
            got=$(PATH="$tmp/bin:/usr/bin:/bin" sh -c "$fn
          platform_asset" 2>/dev/null || echo UNSUPPORTED)
            if [ "$got" != "$3" ]; then
              echo "$1/$2 resolved to '$got', expected '$3'"
              exit 1
            fi
            echo "  $1/$2 -> $got"
          }

          expect Linux  x86_64  geocheck_linux_amd64.tar.gz
          expect Linux  aarch64 geocheck_linux_arm64.tar.gz
          expect Darwin arm64   geocheck_darwin_all.tar.gz
          expect Darwin x86_64  geocheck_darwin_all.tar.gz
          expect Linux  armv7l  UNSUPPORTED

      - name: The launcher must clean up only what it pulled itself
        run: |
          set -euo pipefail

          dir=$(mktemp -d); mkdir -p "$dir/bin"
          for b in sh uname printf touch rm cat grep clear tput; do
            src=$(command -v "$b") && ln -sf "$src" "$dir/bin/$b"
          done

          # A stand-in engine whose "image inspect" succeeds only while a marker
          # file exists, so the marker tracks whether the image is present.
          cat > "$dir/bin/docker" <<ENGINE
          #!/bin/sh
          echo "\$*" >> "$dir/log"
          case "\$1 \$2" in
            "image inspect") [ -f "$dir/present" ] && exit 0 || exit 1 ;;
          esac
          case "\$1" in
            pull) touch "$dir/present"; exit 0 ;;
            run)  exit 7 ;;
            rmi)  rm -f "$dir/present"; exit 0 ;;
          esac
          ENGINE
          chmod +x "$dir/bin/docker"

          # label | image present beforehand | env | want pull,rmi,still-present
          check() {
            : > "$dir/log"
            if [ "$2" = "pre" ]; then touch "$dir/present"; else rm -f "$dir/present"; fi

            set +e
            # $3 is an optional VAR=value for env, and must vanish when empty
            # rather than become an empty argument, so it is left unquoted.
            # shellcheck disable=SC2086
            env PATH="$dir/bin" $3 /bin/sh scripts/geocheck.sh --version >/dev/null 2>&1
            code=$?
            set -e

            pulls=$(grep -c '^pull' "$dir/log" || true)
            rmis=$(grep -c '^rmi'  "$dir/log" || true)
            if [ -f "$dir/present" ]; then left=yes; else left=no; fi

            echo "  $1: pull=$pulls rmi=$rmis image_left=$left exit=$code"
            test "$pulls,$rmis,$left" = "$4" || {
              echo "expected $4, got $pulls,$rmis,$left"; exit 1
            }
            test "$code" -eq 7 || {
              echo "the container's exit status must be forwarded, got $code"; exit 1
            }
          }

          check "pulled by us, so removed again" fresh ""                     "1,1,no"
          check "already present, so untouched"  pre   ""                     "0,0,yes"
          check "KEEP_IMAGE keeps it"            fresh GEOCHECK_KEEP_IMAGE=1  "1,0,yes"

          # Removal must name the exact tag; `rmi` on a bare repository or a
          # broad prune would take images that are not ours.
          grep -qx "rmi ghcr.io/wakeupmetha/geocheck:ing" "$dir/log" || true
          : > "$dir/log"; rm -f "$dir/present"
          env PATH="$dir/bin" /bin/sh scripts/geocheck.sh >/dev/null 2>&1 || true
          grep -qx "rmi ghcr.io/wakeupmetha/geocheck:ing" "$dir/log" || {
            echo "rmi must name the exact image tag; log was:"; cat "$dir/log"; exit 1
          }
          echo "  removal targets the exact tag"

      - name: The launcher must honour a forced runtime
        run: |
          set -euo pipefail

          dir=$(mktemp -d); mkdir -p "$dir/bin"
          for b in sh env uname printf clear tput cat head sed cut mktemp tar chmod rm; do
            src=$(command -v "$b") && ln -sf "$src" "$dir/bin/$b"
          done
          printf '#!/bin/sh\necho "DOCKER $*"\n' > "$dir/bin/docker"
          printf '#!/bin/sh\necho "PODMAN $*"\n' > "$dir/bin/podman"
          chmod +x "$dir/bin/docker" "$dir/bin/podman"

          expect() {
            label=$1; want=$2; envs=$3; shift 3
            set +e
            # shellcheck disable=SC2086
            out=$(env PATH="$dir/bin" $envs /bin/sh scripts/geocheck.sh "$@" 2>&1)
            set -e
            case "$out" in
              *"$want"*) echo "  ✓ $label" ;;
              *) echo "  ✗ $label"; echo "    wanted: $want"; echo "    got:    $out"; exit 1 ;;
            esac
          }

          expect "auto picks docker"          "DOCKER run"  ""                      -4
          expect "--runtime podman"           "PODMAN run"  ""                      --runtime podman -4
          expect "--runtime=podman"           "PODMAN run"  ""                      --runtime=podman
          expect "GEOCHECK_RUNTIME=podman"    "PODMAN run"  GEOCHECK_RUNTIME=podman -4
          expect "the flag beats the variable" "DOCKER run" GEOCHECK_RUNTIME=podman --runtime docker
          expect "an unknown runtime is refused" "unknown runtime" "" --runtime kubernetes
          expect "--runtime needs a value"    "needs a value" ""                    --runtime

          rm "$dir/bin/podman"
          expect "a missing forced runtime errors" "podman is not installed" "" --runtime podman

          expect "geocheck flags pass through" "ghcr.io/wakeupmetha/geocheck:ing --json --no-geo" "" --json --no-geo
          expect "launcher options are stripped" "ghcr.io/wakeupmetha/geocheck:ing -4" "" --runtime docker -4

      - name: The launcher must not defer to an installed geocheck
        run: |
          set -euo pipefail

          # A network launcher exists to deliver the current release. If it ran
          # whatever is already installed, a stale binary would silently win.
          dir=$(mktemp -d); mkdir -p "$dir/bin"
          for b in sh uname printf clear tput; do
            src=$(command -v "$b") && ln -sf "$src" "$dir/bin/$b"
          done
          printf '#!/bin/sh\necho STALE_BINARY_RAN\n' > "$dir/bin/geocheck"
          printf '#!/bin/sh\necho CONTAINER_RAN\n'    > "$dir/bin/docker"
          chmod +x "$dir/bin/geocheck" "$dir/bin/docker"

          out=$(PATH="$dir/bin" /bin/sh scripts/geocheck.sh --version 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q CONTAINER_RAN || {
            echo "the container runtime should have been chosen"; exit 1
          }
          echo "$out" | grep -q STALE_BINARY_RAN && {
            echo "the launcher ran an installed binary instead of the release"; exit 1
          }
          echo "  ✓ ignores an installed geocheck"

      - name: The launcher must fail helpfully when it cannot run anything
        run: |
          set -euo pipefail

          make_path() {
            tmp=$(mktemp -d); mkdir -p "$tmp/bin"
            for b in "$@"; do
              src=$(command -v "$b") && ln -sf "$src" "$tmp/bin/$b"
            done
            echo "$tmp/bin"
          }

          assert_fails_with() {
            wanted=$1; shift
            set +e
            out=$(PATH="$1" /bin/sh scripts/geocheck.sh --version 2>&1); code=$?
            set -e
            echo "$out"
            test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
            echo "$out" | grep -q "$wanted" || {
              echo "message did not mention '$wanted'"; exit 1;
            }
            echo "  ✓ names '$wanted'"
          }

          assert_fails_with "curl or wget" "$(make_path sh uname printf)"

          plat=$(make_path sh printf sed head cut mktemp tar gzip rm chmod)
          # shellcheck disable=SC2016  # $1 belongs to the stub being written
          printf '#!/bin/sh\ncase "$1" in\n  -s) echo Linux ;;\n  -m) echo armv7l ;;\nesac\n' \
            > "$plat/uname"

          cat > "$plat/curl" <<'CURL'
          #!/bin/sh
          printf '{"tag_name": "v9.9.9"}'
          CURL
          chmod +x "$plat/uname" "$plat/curl"

          assert_fails_with "no published build" "$plat"
          assert_fails_with "go install" "$plat"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: geocheck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs, and the raw-socket capability behaves
        run: |
          set -euo pipefail

          docker run --rm geocheck:ci --version
          docker run --rm --cap-drop=ALL geocheck:ci --version

          probe() {
            docker run --rm "$@" geocheck:ci -4 --no-geo --no-detect \
              -T cloudflare_dns --rounds 2 -q --json | jq -r '.connectivity.privileged'
          }

          priv=$(probe)
          echo "privileged with the file capability: $priv"
          test "$priv" = "true" || {
            echo "the image cannot open a raw socket; check setcap in the Dockerfile"
            exit 1
          }

          priv=$(probe --cap-drop=ALL)
          echo "privileged with --cap-drop=ALL: $priv"
          test "$priv" = "false" || {
            echo "expected the raw socket to be unavailable once NET_RAW is dropped"
            exit 1
          }
